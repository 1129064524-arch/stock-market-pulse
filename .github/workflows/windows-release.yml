name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build local API
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --distpath build/backend --workpath build/pyinstaller desktop/backend.spec

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build desktop app
        run: |
          npm ci
          npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path build/desktop-dist -Filter *.exe -File)
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installer was produced in build/desktop-dist"
          }
          $installers | Select-Object -ExpandProperty FullName

      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem -Path build/desktop-dist -Filter *.exe -File)
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --generate-notes
          }
          foreach ($installer in $installers) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }
